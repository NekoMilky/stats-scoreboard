name: Publish Multi-Version Mod
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Build all versions
        run: chmod +x gradlew && ./gradlew build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            versions/1.21/build/libs/*.jar
            versions/1.21.2/build/libs/*.jar
            versions/1.21.5/build/libs/*.jar
            versions/1.21.9/build/libs/*.jar
            versions/1.21.11/build/libs/*.jar
            versions/26.1/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish 1.21
        id: publish_1_21
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_ID }}
          curseforge-id: ${{ secrets.CURSEFORGE_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          version: ${{ github.ref_name }}+1.21
          version-type: release
          loaders: fabric
          game-versions: ">=1.21 <=1.21.1"
          files: versions/1.21/build/libs/*.jar

      - name: Publish 1.21.2
        id: publish_1_21_2
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_ID }}
          curseforge-id: ${{ secrets.CURSEFORGE_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          version: ${{ github.ref_name }}+1.21.2
          version-type: release
          loaders: fabric
          game-versions: ">=1.21.2 <=1.21.4"
          files: versions/1.21.2/build/libs/*.jar

      - name: Publish 1.21.5
        id: publish_1_21_5
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_ID }}
          curseforge-id: ${{ secrets.CURSEFORGE_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          version: ${{ github.ref_name }}+1.21.5
          version-type: release
          loaders: fabric
          game-versions: ">=1.21.5 <=1.21.8"
          files: versions/1.21.5/build/libs/*.jar

      - name: Publish 1.21.9
        id: publish_1_21_9
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_ID }}
          curseforge-id: ${{ secrets.CURSEFORGE_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          version: ${{ github.ref_name }}+1.21.9
          version-type: release
          loaders: fabric
          game-versions: ">=1.21.9 <=1.21.10"
          files: versions/1.21.9/build/libs/*.jar

      - name: Publish 1.21.11
        id: publish_1_21_11
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_ID }}
          curseforge-id: ${{ secrets.CURSEFORGE_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          version: ${{ github.ref_name }}+1.21.11
          version-type: release
          loaders: fabric
          game-versions: "1.21.11"
          files: versions/1.21.11/build/libs/*.jar

      - name: Publish 26.1
        id: publish_26_1
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_ID }}
          curseforge-id: ${{ secrets.CURSEFORGE_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          version: ${{ github.ref_name }}+26.1
          version-type: release
          loaders: fabric
          game-versions: ">=26.1 <=26.1.2"
          files: versions/26.1/build/libs/*.jar
