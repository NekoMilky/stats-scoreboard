name: Publish Multi-Version Mod
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build all versions
        run: chmod +x gradlew && ./gradlew build

      - name: Publish to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: fy7jmMai
          curseforge-id: 1534040

          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          version: ${{ github.ref_name }}
          version-type: release

          loaders: fabric

          files: |
            versions/1.21/build/libs/*.jar
              | game-versions: ">=1.21 <=1.21.1"
            
            versions/1.21.2/build/libs/*.jar
              | game-versions: ">=1.21.2 <=1.21.4"
            
            versions/1.21.5/build/libs/*.jar
              | game-versions: ">=1.21.5 <=1.21.8"
            
            versions/1.21.9/build/libs/*.jar
              | game-versions: ">=1.21.9 <=1.21.10"
            
            versions/1.21.11/build/libs/*.jar
              | game-versions: 1.21.11
            
            versions/26.1/build/libs/*.jar
              | game-versions: "~26.1"
