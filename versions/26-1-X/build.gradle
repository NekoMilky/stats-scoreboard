plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base {
    archivesName = "${rootProject.name}"
}
version = "${rootProject.mod_version}+26.1"
group = rootProject.maven_group

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.nucleoid.xyz/' }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "stats-scoreboard" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:26.1"
    implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:0.145.1+26.1"
    implementation include("eu.pb4:sidebar-api:0.6.0+26.1")
    implementation include("xyz.nucleoid:server-translations-api:3.0.3+26.1")
    implementation project(":common")
}

processResources {
    def currentVersion = version
    inputs.property "version", currentVersion
    filesMatching("fabric.mod.json") {
        expand "version": currentVersion
    }
    from project(':common').file('src/main/resources')
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${rootProject.name}" }
    }
    dependsOn ':common:jar'
    from sourceSets.main.output
    from {
        zipTree(project(':common').tasks.jar.archiveFile)
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {}
}
